<div id="root" class="a b c" data-state='{"open":true,"tags":["x","y"]}'
     aria-label='Say "hello" &amp; welcome'
     title="Unquoted path=/api/v1?sort=desc&limit=10"
     data-url='https://example.com?q="heavy"&amp;z=1'
     style="background: linear-gradient(90deg, #000 0%, #fff 100%); --x: 1rem;"
     onclick="return false"
     custom-attr
     EMPTY=""
     mixedCaseAttr="preserve-value-case">
  <input type="text" readonly required autofocus tabindex="1" accesskey="s"
         aria-invalid="true" aria-describedby="hint"
         value="quoted > inside &lt;attr&gt;">
  <input type="checkbox" checked disabled="false" aria-checked="true">
  <img src="photo.jpg" alt='Alt with "quotes"' width="100" height="100" ismap usemap="#map">
  <map name="map">
    <area shape="rect" coords="0,0,50,50" href="/a" alt="A">
    <area shape="default" href="/b" alt="B">
  </map>
  <p>Text with &lt;brackets&gt; and   intentional   spaces.</p>
  <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4f8cff"/>
        <stop offset="100%" stop-color="#3dd68c"/>
      </linearGradient>
    </defs>
    <rect width="10" height="10" fill="url(#g)" rx="1"/>
  </svg>
  <!-- comment with -- tricky -- dashes -->
  <span></span>
</div>
